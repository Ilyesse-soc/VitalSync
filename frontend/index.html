<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VitalSync</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 40px; }
      .card { max-width: 720px; padding: 24px; border: 1px solid #ddd; border-radius: 12px; }
      code { background: #f5f5f5; padding: 2px 6px; border-radius: 6px; }
      .ok { color: #0a7; }
      .ko { color: #b00; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>VitalSync</h1>
      <p>Frontend statique servi par <code>Nginx</code> avec proxy <code>/api</code> vers le backend.</p>

      <h2>État</h2>
      <p id="status">Chargement...</p>
      <pre id="payload"></pre>
    </div>

    <script>
      async function main() {
        const statusEl = document.getElementById('status');
        const payloadEl = document.getElementById('payload');

        try {
          const res = await fetch('/api/health', { cache: 'no-store' });
          const data = await res.json();

          if (!res.ok) {
            statusEl.className = 'ko';
            statusEl.textContent = 'Backend inaccessible';
            payloadEl.textContent = JSON.stringify(data, null, 2);
            return;
          }

          statusEl.className = 'ok';
          statusEl.textContent = 'Backend OK';
          payloadEl.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
          statusEl.className = 'ko';
          statusEl.textContent = 'Erreur réseau';
          payloadEl.textContent = String(e);
        }
      }

      main();
    </script>
  </body>
</html>
