name: CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vitalsync-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vitalsync-frontend

jobs:
  quality:
    name: Qualité (ESLint + Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        working-directory: backend
        run: npm ci

      - name: ESLint
        working-directory: backend
        run: npm run lint

      - name: Tests (Jest)
        working-directory: backend
        run: npm test

  docker_build_push:
    name: Build & Push (Docker)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -t $BACKEND_IMAGE:${{ github.sha }} -t $BACKEND_IMAGE:latest ./backend

      - name: Build frontend image
        run: |
          docker build -t $FRONTEND_IMAGE:${{ github.sha }} -t $FRONTEND_IMAGE:latest ./frontend

      - name: Push images
        run: |
          docker push $BACKEND_IMAGE:${{ github.sha }}
          docker push $BACKEND_IMAGE:latest
          docker push $FRONTEND_IMAGE:${{ github.sha }}
          docker push $FRONTEND_IMAGE:latest

  integration_compose:
    name: Test d'intégration (docker-compose + /health)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer .env
        run: |
          cat > .env <<'EOF'
          FRONTEND_PORT=8081
          BACKEND_PORT=3000
          POSTGRES_DB=vitalsync
          POSTGRES_USER=vitalsync
          POSTGRES_PASSWORD=vitalsync_ci
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=vitalsync
          DB_USER=vitalsync
          DB_PASSWORD=vitalsync_ci
          NODE_ENV=production
          EOF

      - name: Démarrer la stack
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Healthcheck backend (/health)
        run: |
          # Exigence du sujet : vérifier explicitement l'endpoint backend /health
          for i in {1..30}; do
            if docker compose exec -T backend node -e "require('http').get('http://localhost:3000/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"; then
              echo "Health OK";
              exit 0;
            fi
            echo "Waiting for services... ($i/30)";
            sleep 2;
          done
          echo "Healthcheck failed";
          docker compose logs --no-color
          exit 1

      - name: Stop stack
        if: always()
        run: |
          docker compose down -v
